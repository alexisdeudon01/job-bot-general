version: '3.9'

services:
  analyzer:
    build: ./analyzer
    env_file: .env
    volumes:
      - ./data:/data
      - ./output:/output

  generator:
    build: ./generator
    env_file: .env
    volumes:
      - ./data:/data
      - ./output:/output
    depends_on:
      - analyzer

  dashboard:
    build: ./dashboard
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
      - ./output:/output
    depends_on:
      - generator
