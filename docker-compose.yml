

services:
  dashboard:
    build: ./dashboard
    env_file: .env
    environment:
      STREAMLIT_SERVER_RUN_ON_SAVE: "false"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
      - ./output:/output
      - ./analyzer:/app/analyzer
      - ./generator:/app/generator
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  analyzer:
    build: ./analyzer
    env_file: .env
    profiles: ["batch"]
    volumes:
      - ./data:/data
      - ./output:/output
    restart: "no"

  generator:
    build: ./generator
    env_file: .env
    profiles: ["batch"]
    volumes:
      - ./data:/data
      - ./output:/output
    restart: "no"

  mcp:
    build: ./mcp_server
    env_file: .env
    profiles: ["mcp"]
    volumes:
      - ./data:/data
      - ./output:/output
      - ./mcp_server:/app
    stdin_open: true
    tty: true
    restart: "no"
