services:
  # ── Base de données ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:latest
    container_name: db-postgres
    environment:
      POSTGRES_DB: job_bot_general
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Orchestrateur FastAPI ────────────────────────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      APP_ENV: docker
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/job_bot_general
      PYTHONPATH: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/data
      - ./output:/output
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mcp-net
    restart: unless-stopped

  # ── Dashboard Streamlit ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      STREAMLIT_SERVER_RUN_ON_SAVE: "false"
      DASHBOARD_API_BASE_URL: http://orchestrator:8000
      PYTHONPATH: /app
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./data:/data
      - ./output:/output
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - orchestrator
    networks:
      - mcp-net
    restart: unless-stopped

  # ── Services batch ───────────────────────────────────────────────────────────
  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    env_file: .env
    profiles: ["batch"]
    environment:
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/data
      - ./output:/output
    networks:
      - mcp-net
    restart: "no"

  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    env_file: .env
    profiles: ["batch"]
    environment:
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/data
      - ./output:/output
    networks:
      - mcp-net
    restart: "no"

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: .env
    profiles: ["batch"]
    environment:
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/data
      - ./output:/output
    networks:
      - mcp-net
    restart: "no"

  # ── MCP Host (nouvelle architecture top-down) ────────────────────────────────
  mcp-host:
    build:
      context: .
      dockerfile: mcp_host/Dockerfile
    container_name: mcp-host
    env_file: .env
    profiles: ["mcp"]
    environment:
      PYTHONPATH: /app
      # Connexion DB via le nom de service Docker (db)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/job_bot_general
      ORCHESTRATOR_URL: http://orchestrator:8000
      # Chemin projet monté dans le container (pour le serveur filesystem)
      PROJECT_ROOT: /app
    working_dir: /app
    volumes:
      # Monte le projet complet en lecture/écriture (accès filesystem MCP)
      - /home/tor/Downloads/job-bot-general:/app
      - ./data:/data
      - ./output:/output
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    networks:
      - mcp-net
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  postgres_data:

# ── Réseau interne MCP ────────────────────────────────────────────────────────
networks:
  mcp-net:
    driver: bridge
    name: mcp-net
