name: secrets-check

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
    steps:
      - name: Mask secrets
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "::add-mask::$OPENAI_API_KEY"
          fi
          if [ -n "$SGAI_API_KEY" ]; then
            echo "::add-mask::$SGAI_API_KEY"
          fi

      - name: Verify required API keys are configured
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is missing"
            exit 1
          fi

          echo "OPENAI_API_KEY is configured"
          if [ -n "$SGAI_API_KEY" ]; then
            echo "SGAI_API_KEY is configured"
          else
            echo "SGAI_API_KEY is not set (optional for non-scraping runs)"
          fi
