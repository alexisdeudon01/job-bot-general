name: secrets-check

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Mask secrets
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "::add-mask::$OPENAI_API_KEY"
          fi
          if [ -n "$SGAI_API_KEY" ]; then
            echo "::add-mask::$SGAI_API_KEY"
          fi
          if [ -n "$GH_TOKEN" ]; then
            echo "::add-mask::$GH_TOKEN"
          fi
          if [ -n "$DATABASE_URL" ]; then
            echo "::add-mask::$DATABASE_URL"
          fi

      - name: Verify required API keys are configured
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is missing"
            exit 1
          fi

          echo "OPENAI_API_KEY is configured"
          if [ -n "$SGAI_API_KEY" ]; then
            echo "SGAI_API_KEY is configured"
          else
            echo "SGAI_API_KEY is not set (optional for non-scraping runs)"
          fi

          if [ -n "$GH_TOKEN" ]; then
            echo "GH_TOKEN is configured"
          else
            echo "GH_TOKEN is not set (optional unless GitHub secret automation is used)"
          fi

          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL is configured"
          else
            echo "DATABASE_URL is not set (required for DB-backed runs)"
          fi
