name: ci-general

on:
  push:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "dashboard/**"
      - "mcp_host/**"
      - "data/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/ci-general.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/integration-e2e.yml"
      - ".github/workflows/secrets-check.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "dashboard/**"
      - "mcp_host/**"
      - "data/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/ci-general.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/integration-e2e.yml"
      - ".github/workflows/secrets-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-general-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker build tests
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit

  integration-e2e:
    name: Integration and E2E tests
    needs: docker-build
    uses: ./.github/workflows/integration-e2e.yml
    secrets: inherit