name: integration-e2e

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "dashboard/**"
      - "mcp_host/**"
      - "data/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/ci-general.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/integration-e2e.yml"
      - ".github/workflows/secrets-check.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "dashboard/**"
      - "mcp_host/**"
      - "data/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/ci-general.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/integration-e2e.yml"
      - ".github/workflows/secrets-check.yml"

permissions:
  contents: read

concurrency:
  group: integration-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  integration-e2e:
    name: Integration and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      SGAI_API_KEY: ${{ secrets.SGAI_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/job_bot_general
      CV_UPLOAD_DIR: /home/runner/work/job-bot-general/job-bot-general/data
      E2E_JOB_URL: https://jobs.ashbyhq.com/openai/3f0f0b36-5108-4474-92f9-252df54807c7
      COMPOSE_PROFILES: mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mask configured secrets
        run: |
          for value in "$OPENAI_API_KEY" "$SGAI_API_KEY" "$ANTHROPIC_API_KEY"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Evaluate available credentials and planned test scope
        id: secret_check
        run: |
          set -euo pipefail

          mcp_provider="none"
          if [ -n "$OPENAI_API_KEY" ]; then
            mcp_provider="openai"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            mcp_provider="anthropic"
          fi

          run_api_e2e="false"
          if [ -n "$OPENAI_API_KEY" ]; then
            run_api_e2e="true"
          fi

          run_mcp_prompt="false"
          if [ "$mcp_provider" != "none" ]; then
            run_mcp_prompt="true"
          fi

          echo "mcp_provider=$mcp_provider" >> "$GITHUB_OUTPUT"
          echo "run_api_e2e=$run_api_e2e" >> "$GITHUB_OUTPUT"
          echo "run_mcp_prompt=$run_mcp_prompt" >> "$GITHUB_OUTPUT"

          echo "Credential summary:"
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "- OPENAI_API_KEY: configured"
          else
            echo "- OPENAI_API_KEY: missing"
          fi
          if [ -n "$SGAI_API_KEY" ]; then
            echo "- SGAI_API_KEY: configured"
          else
            echo "- SGAI_API_KEY: missing (optional; scraping may fall back or fail)"
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "- ANTHROPIC_API_KEY: configured"
          else
            echo "- ANTHROPIC_API_KEY: missing (optional alternative MCP provider)"
          fi

          echo "Planned test scope:"
          echo "- Docker Compose connectivity: enabled"
          echo "- Orchestrator API smoke test: enabled"
          if [ "$run_mcp_prompt" = "true" ]; then
            echo "- MCP host prompt test: enabled via provider '$mcp_provider'"
          else
            echo "- MCP host prompt test: skipped (no supported LLM provider secret)"
          fi
          if [ "$run_api_e2e" = "true" ]; then
            echo "- Pipeline /full E2E test: enabled"
          else
            echo "- Pipeline /full E2E test: skipped (requires OPENAI_API_KEY)"
          fi

      - name: Create CI .env file for docker compose
        run: |
          {
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            echo "SGAI_API_KEY=$SGAI_API_KEY"
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/job_bot_general"
            echo "CV_UPLOAD_DIR=/data"
            echo "OPENAI_MODEL=gpt-4o-mini"
          } > .env

      - name: Start required docker compose services
        run: docker compose --profile mcp up -d --build postgres orchestrator mcp-host

      - name: Show docker compose status
        if: always()
        run: docker compose --profile mcp ps

      - name: Wait for orchestrator API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/docs >/dev/null; then
              echo "Orchestrator is reachable on attempt $attempt"
              exit 0
            fi
            echo "Waiting for orchestrator... ($attempt/30)"
            sleep 5
          done
          echo "Orchestrator did not become reachable in time"
          docker compose --profile mcp logs orchestrator
          exit 1

      - name: Test orchestrator pipeline routes connectivity
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/api/v1/pipeline/runs | tee /tmp/pipeline-runs.json
          grep -q '"runs"' /tmp/pipeline-runs.json

      - name: List MCP tools from host container
        run: |
          set -euo pipefail
          docker compose --profile mcp exec -T mcp-host python -m mcp_host.main --list-tools | tee /tmp/mcp-tools.txt
          grep -q "Total :" /tmp/mcp-tools.txt

      - name: Run MCP host prompt test
        if: steps.secret_check.outputs.run_mcp_prompt == 'true'
        run: |
          set -euo pipefail
          docker compose --profile mcp exec -T mcp-host python -m mcp_host.main --provider "${{ steps.secret_check.outputs.mcp_provider }}" --prompt "Dis bonjour en une phrase courte et indique combien d'outils MCP sont disponibles." | tee /tmp/mcp-prompt.txt
          test -s /tmp/mcp-prompt.txt

      - name: Skip MCP host prompt test with clear reason
        if: steps.secret_check.outputs.run_mcp_prompt != 'true'
        run: echo "Skipping MCP prompt test because neither OPENAI_API_KEY nor ANTHROPIC_API_KEY is configured."

      - name: Run pipeline full E2E cover-letter use case
        if: steps.secret_check.outputs.run_api_e2e == 'true'
        run: |
          set -euo pipefail
          payload=$(printf '{"source":"github-actions","payload":{"job_url":"%s","cv_pdf_path":"cv_upload.pdf"},"options":{"mode":"e2e-demo","allow_external_fetch":true},"job_url":"%s","cv_pdf_path":"cv_upload.pdf"}' "$E2E_JOB_URL" "$E2E_JOB_URL")
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/pipeline/full -H "Content-Type: application/json" -d "$payload" | tee /tmp/pipeline-full.json
          grep -q '"pipeline_type":"full"' /tmp/pipeline-full.json
          grep -q '"steps"' /tmp/pipeline-full.json
          grep -Eq '"step":"3_generate_cover_letter".*"status":"(completed|failed|skipped)"' /tmp/pipeline-full.json

      - name: Skip pipeline full E2E test with clear reason
        if: steps.secret_check.outputs.run_api_e2e != 'true'
        run: echo "Skipping pipeline /api/v1/pipeline/full E2E test because OPENAI_API_KEY is not configured."

      - name: Show compose logs on failure
        if: failure()
        run: docker compose --profile mcp logs --no-color

      - name: Tear down docker compose stack
        if: always()
        run: docker compose --profile mcp down -v
