name: docker-build

on:
  push:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "dashboard/**"
      - "mcp_host/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "dashboard/**"
      - "mcp_host/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_sgai_key: ${{ steps.secret_check.outputs.has_sgai_key }}
    steps:
      - name: Check ScrapeGraph secret availability
        id: secret_check
        env:
          SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
        run: |
          if [[ -n "${SGAI_API_KEY}" ]]; then
            echo "has_sgai_key=true" >> "$GITHUB_OUTPUT"
            echo "SGAI_API_KEY is available for workflow runtime."
          else
            echo "has_sgai_key=false" >> "$GITHUB_OUTPUT"
            echo "SGAI_API_KEY is not configured. Secret-dependent checks will be skipped."
          fi

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: orchestrator
            dockerfile: app/Dockerfile
          - name: dashboard
            dockerfile: dashboard/Dockerfile
          - name: mcp-host
            dockerfile: mcp_host/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: job-bot-general/${{ matrix.image.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scrapegraph-connectivity:
    name: Verify ScrapeGraph connectivity
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.has_sgai_key == 'true' }}
    timeout-minutes: 15
    env:
      SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Verify ScrapeGraph connectivity
        run: |
          python - <<'PY'
          from mcp_host.clients.scrapegraph_client import ScrapegraphClient

          client = ScrapegraphClient()
          result = client.fetch_markdown("https://example.com")

          assert result is not None, "Expected a response from ScrapeGraph"
          text = str(result)
          assert text.strip(), "Empty ScrapeGraph response"

          print("ScrapeGraph connectivity OK")
          PY

  scrapegraph-connectivity-skipped:
    name: Report skipped ScrapeGraph check
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.has_sgai_key != 'true' }}
    timeout-minutes: 5
    steps:
      - name: Skip connectivity test when secret is absent
        run: echo "Skipping ScrapeGraph connectivity test because SGAI_API_KEY is not configured."
