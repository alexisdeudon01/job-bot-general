name: docker-build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "dashboard/**"
      - "mcp_host/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "dashboard/**"
      - "mcp_host/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  docker-build:
    name: Build and smoke-test Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: orchestrator
            context: .
            dockerfile: app/Dockerfile
          - name: dashboard
            context: .
            dockerfile: dashboard/Dockerfile
          - name: mcp-host
            context: .
            dockerfile: mcp_host/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: job-bot-general/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Smoke test ${{ matrix.image.name }} image metadata
        run: docker image inspect job-bot-general/${{ matrix.image.name }}:latest >/dev/null
