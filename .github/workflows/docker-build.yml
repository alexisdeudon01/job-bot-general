name: docker-build

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [analyzer, generator, dashboard]
    env:
      SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ScrapeGraph secret wiring
        if: ${{ env.SGAI_API_KEY != '' }}
        run: echo "SGAI_API_KEY is available for workflow runtime."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: job-bot-general/${{ matrix.service }}:ci
          build-args: |
            SGAI_API_KEY=${{ env.SGAI_API_KEY }}